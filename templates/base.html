<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ company }} — Property Management</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;
  --accent:#6c63ff;--accent2:#a78bfa;
  --green:#22c55e;--red:#ef4444;--amber:#f59e0b;
  --text:#f0f0f8;--muted:#8b8fa8;--border:#2e3350;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex}
a{color:inherit;text-decoration:none}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);padding:24px 0;display:flex;flex-direction:column;position:fixed;height:100vh}
.logo{padding:0 20px 24px;border-bottom:1px solid var(--border);margin-bottom:16px}
.logo h1{font-family:'DM Serif Display',serif;font-size:18px;color:var(--accent2);line-height:1.2}
.logo p{font-size:11px;color:var(--muted);margin-top:2px}
.nav-link{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:13px;color:var(--muted);transition:.15s;border-left:3px solid transparent}
.nav-link:hover,.nav-link.active{color:var(--text);background:var(--surface2);border-left-color:var(--accent)}
.nav-icon{font-size:16px;width:20px;text-align:center}
.main{margin-left:220px;flex:1;padding:32px}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.page-title{font-family:'DM Serif Display',serif;font-size:28px;color:var(--text)}
.btn{padding:9px 18px;border-radius:8px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#5a52e0}
.btn-danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn-success{background:var(--green);color:#fff}
.btn-sm{padding:5px 12px;font-size:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500}
.badge-green{background:rgba(34,197,94,.15);color:var(--green)}
.badge-red{background:rgba(239,68,68,.15);color:var(--red)}
.badge-amber{background:rgba(245,158,11,.15);color:var(--amber)}
.badge-purple{background:rgba(108,99,255,.15);color:var(--accent2)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:10px 14px;border-bottom:1px solid var(--border)}
td{padding:12px 14px;font-size:13px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;width:480px;max-width:95vw}
.modal h2{font-family:'DM Serif Display',serif;font-size:22px;margin-bottom:20px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none}
.form-group input:focus,.form-group select:focus{border-color:var(--accent)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 20px;font-size:13px;z-index:999;transform:translateY(100px);opacity:0;transition:.3s}
.toast.show{transform:translateY(0);opacity:1}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo">
    <h1>LK Property</h1>
    <p>Management System</p>
  </div>
  <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}"><span class="nav-icon">📊</span> Dashboard</a>
  <a href="/properties" class="nav-link {% if '/properties' in request.path %}active{% endif %}"><span class="nav-icon">🏠</span> Properties</a>
  <a href="/tenants" class="nav-link {% if '/tenants' in request.path %}active{% endif %}"><span class="nav-icon">👥</span> Tenants</a>
  <a href="/maintenance" class="nav-link {% if '/maintenance' in request.path %}active{% endif %}"><span class="nav-icon">🔧</span> Maintenance</a>
</aside>
<main class="main">
  {% block content %}{% endblock %}
</main>
<div id="toast" class="toast"></div>
<script>
function showToast(msg, ok=true){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.borderColor=ok?'var(--green)':'var(--red)';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
async function post(url, data){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  return r.json();
}
</script>
</body>
</html>
